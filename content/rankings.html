<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WESPA Rankings</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px;
    }

	body {
		margin: 0;
		font-family: 'Montserrat', Arial, sans-serif;
		background: #f4f7fb;
		color: #1f2d3d;
		font-weight: 400;
	}

	h1 {
		margin-bottom: 4px;
		color: #163b5c;
		font-weight: 700;
		letter-spacing: -0.02em;
	}
    .subtext {
        color: #66788a;
        margin-bottom: 20px;
    }

    .toolbar {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 16px;
    }

    input, select {
        padding: 10px 12px;
        border: 1px solid #cfd9e6;
        border-radius: 6px;
        font-size: 14px;
    }

    input {
        flex: 1;
        min-width: 240px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    th, td {
        padding: 10px 12px;
        border-bottom: 1px solid #edf1f5;
        text-align: left;
        font-size: 14px;
    }

    th {
        background: #163b5c;
        color: white;
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
    }

    tr:hover {
        background: #f7fbff;
    }

    .rank {
        width: 60px;
        font-weight: bold;
        color: #163b5c;
    }

    .rating {
        font-weight: 700;
    }

    .name-column {
        width: 27%;
    }

    .player-link {
        color: #1f6392;
        text-decoration: none;
        font-weight: 500;
    }

    .player-link:hover {
        text-decoration: underline;
    }

    .muted {
        color: #66788a;
    }

    .status {
        margin: 12px 0;
        color: #66788a;
    }

    .error {
        padding: 16px;
        background: #ffecec;
        border: 1px solid #ffb3b3;
        color: #8a1f1f;
        border-radius: 6px;
    }

    @media (max-width: 700px) {
        .container {
            padding: 14px;
        }

        table {
            font-size: 13px;
        }

        th, td {
            padding: 8px;
        }

        .hide-mobile {
            display: none;
        }
		.explainer {
			font-size: 0.95rem;
			color: #66788a;
			margin-bottom: 4px;
		}

		.last-updated {
			font-size: 0.78rem;
			color: #8a9aad;
		}
    }
</style>
</head>

<body>
<div class="container">
    <h1>WESPA Rankings</h1>
    <div class="subtext" id="summary">Loading latest rankings...</div>

    <div class="toolbar">
        <input id="searchBox" type="text" placeholder="Search player, country, or title..." />
        <select id="countryFilter">
            <option value="">All countries</option>
        </select>
    </div>

    <div class="status" id="status"></div>

    <table>
        <thead>
            <tr>
                <th data-sort="rank">Rank</th>
                <th data-sort="titleDisplay">Title</th>
                <th data-sort="name" class="name-column">Name</th>
                <th data-sort="country">Country</th>
                <th data-sort="rating">Rating</th>
                <th data-sort="games" class="hide-mobile">Games</th>
                <th data-sort="lastPlayed" class="hide-mobile">Last Played</th>
            </tr>
        </thead>
        <tbody id="rankingsBody"></tbody>
    </table>
</div>

<script>
const SOURCE_FILE = 'latest.txt';
const DUPLICATES_FILE = 'duplicates.txt';
const API_BASE = '/api';
const MIN_GAMES = 50;
const ACTIVE_DAYS = 730;
const AUTO_REFRESH_MS = 60 * 1000;

let allPlayers = [];
let filteredPlayers = [];
let sortKey = 'rank';
let sortAsc = true;
let playerIdMap = new Map();

const summary = document.getElementById('summary');
const statusEl = document.getElementById('status');
const rankingsBody = document.getElementById('rankingsBody');
const searchBox = document.getElementById('searchBox');
const countryFilter = document.getElementById('countryFilter');

initializePage();
setInterval(() => loadRankings({ silent: true }), AUTO_REFRESH_MS);

async function initializePage() {
    await loadPlayerIdMap();
    await loadRankings();
}

async function loadPlayerIdMap() {
    try {
        const resp = await fetch(`${API_BASE}/players.php?idsonly=1`, { cache: 'no-store' });
        if (!resp.ok) throw new Error(`Failed to fetch player IDs: HTTP ${resp.status}`);

        const data = await resp.json();
        const map = new Map();

        for (const p of data.players || []) {
            if (!p.name || p.playerid == null) continue;
            map.set(nameKey(p.name), p.playerid);
        }

        playerIdMap = map;
    } catch (err) {
        console.error('Could not load player ID map:', err);
        playerIdMap = new Map();
    }
}

async function loadRankings({ silent = false } = {}) {
    try {
        // Cache-busting ensures both uploaded source files are reread.
        const version = Date.now();
        const [rankingsResp, duplicatesResp] = await Promise.all([
            fetch(`${SOURCE_FILE}?v=${version}`, { cache: 'no-store' }),
            fetch(`${DUPLICATES_FILE}?v=${version}`, { cache: 'no-store' })
        ]);

        if (!rankingsResp.ok) {
            throw new Error(`Unable to load ${SOURCE_FILE}: HTTP ${rankingsResp.status}`);
        }
        if (!duplicatesResp.ok) {
            throw new Error(`Unable to load ${DUPLICATES_FILE}: HTTP ${duplicatesResp.status}`);
        }

        const [text, duplicatesText] = await Promise.all([
            rankingsResp.text(),
            duplicatesResp.text()
        ]);

        const preferredNames = parseDuplicatesTxt(duplicatesText);
        const parsed = parseLatestTxt(text, preferredNames);

        // Protect the current page from a partially uploaded or malformed file.
        if (parsed.players.length === 0) {
            throw new Error(`${SOURCE_FILE} contained no valid active ranking records.`);
        }

        allPlayers = parsed.players;
        populateCountryFilter(allPlayers);

        summary.innerHTML = `
            <div class="explainer">
                Showing players active within 2 years with at least ${MIN_GAMES} rated games.
            </div>
            <div class="last-updated">
                Last updated: ${formatDate(parsed.snapshotDate)}
            </div>
        `;
        applyFilters();
    } catch (err) {
        console.error(err);
        if (!silent || allPlayers.length === 0) {
            summary.innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
        } else {
            statusEl.textContent = `Automatic refresh failed; showing the previous valid rankings.`;
        }
    }
}

function normalizeName(name) {
    return String(name)
        .trim()
        .replace(/\s+/g, ' ');
}

function nameKey(name) {
    return normalizeName(name).toLocaleLowerCase('en');
}

function parseDuplicatesTxt(text) {
    const preferredNames = new Map();

    for (const rawLine of text.split(/\r?\n/)) {
        const line = rawLine.trim();
        if (!line || line.startsWith('#')) continue;

        const names = line
            .split(',')
            .map(normalizeName)
            .filter(Boolean);

        if (names.length === 0) continue;

        const preferred = names[0];

        // Last declaration wins. This lets later correction sections override
        // an older mapping higher up in duplicates.txt.
        for (const name of names) {
            preferredNames.set(nameKey(name), preferred);
        }
    }

    return preferredNames;
}

function resolvePreferredName(name, preferredNames) {
    let resolved = normalizeName(name);
    const seen = new Set();

    // Follow chained mappings safely, e.g. old alias -> newer alias -> preferred.
    while (true) {
        const key = nameKey(resolved);
        if (seen.has(key)) break;
        seen.add(key);

        const next = preferredNames.get(key);
        if (!next) break;

        const nextName = normalizeName(next);
        if (nameKey(nextName) === key) {
            resolved = nextName;
            break;
        }

        resolved = nextName;
    }

    return resolved;
}

function parseLatestTxt(text, preferredNames) {
    const lines = text.split(/\r?\n/).filter(line => line.trim());

    if (lines.length === 0) {
        return { snapshotDate: new Date(), players: [] };
    }

    const header = lines[0];
    const headerDateMatch = header.match(/(\d{8})\s*$/);
    const snapshotDate = headerDateMatch
        ? parseYYYYMMDD(headerDateMatch[1])
        : new Date();

    const cutoff = new Date(snapshotDate);
    cutoff.setDate(cutoff.getDate() - ACTIVE_DAYS);

    const players = [];

    for (let i = 1; i < lines.length; i++) {
        const p = parsePlayerLine(lines[i]);
        if (!p) continue;

        p.sourceName = p.name;
        p.name = resolvePreferredName(p.name, preferredNames);

        if (p.games < MIN_GAMES) continue;
        if (p.lastPlayed < cutoff) continue;

        players.push(p);
    }

    // latest.txt is already rating-sorted, but sort again for safety.
    players.sort((a, b) =>
    b.rating - a.rating ||
    b.games - a.games ||
    a.name.localeCompare(b.name)
);

    players.forEach((p, idx) => {
        p.rank = idx + 1;
    });

    return { snapshotDate, players };
}

function parsePlayerLine(line) {
    /*
      latest.txt begins with fixed fields for code and country. The remaining
      fields are parsed from the right so 20-character names, apostrophes,
      hyphens and embedded spaces remain safe. The final two fields contain
      the player's title and norm progress.
    */

    if (line.length < 20) return null;

    const prefix = line.match(/^(.{4})\s(.{3})\s/);
    if (!prefix) return null;

    const code = prefix[1].trim();
    const country = prefix[2].trim();
    const payload = line.slice(9);
    const match = payload.match(
        /^(.+?)\s+(\d+)\s+(\d+)\s+(\d{8})\s+\d+\s+(GM|IM|M|--)\s+(\*+|--)\s*$/
    );
    if (!match) return null;

    const name = match[1].trim();
    const games = Number(match[2]);
    const rating = Number(match[3]);
    const lastPlayedRaw = match[4];
    const title = match[5] === '--' ? '' : match[5];
    const norms = match[6] === '--' ? '' : match[6];
    const titleDisplay = `${title}${norms}`;

    if (!code || !country || !name) return null;
    if (!Number.isFinite(games) || !Number.isFinite(rating)) return null;

    const lastPlayed = parseYYYYMMDD(lastPlayedRaw);
    if (isNaN(lastPlayed)) return null;

    return {
        code,
        title,
        norms,
        titleDisplay,
        country,
        name,
        games,
        rating,
        lastPlayedRaw,
        lastPlayed
    };
}

function parseYYYYMMDD(s) {
    const year = Number(s.slice(0, 4));
    const month = Number(s.slice(4, 6)) - 1;
    const day = Number(s.slice(6, 8));
    return new Date(year, month, day);
}

function formatDate(d) {
    if (!(d instanceof Date) || isNaN(d)) return '';
    return d.toLocaleDateString('en-GB', {
        year: 'numeric',
        month: 'short',
        day: 'numeric'
    });
}

function populateCountryFilter(players) {
    const selected = countryFilter.value;
    const countries = [...new Set(players.map(p => p.country))].sort();

    countryFilter.innerHTML = '<option value="">All countries</option>';

    for (const c of countries) {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        countryFilter.appendChild(opt);
    }

    if (countries.includes(selected)) {
        countryFilter.value = selected;
    }
}

function applyFilters() {
    const q = searchBox.value.trim().toLowerCase();
    const country = countryFilter.value;

    filteredPlayers = allPlayers.filter(p => {
        const matchesSearch =
            !q ||
            p.name.toLowerCase().includes(q) ||
            p.sourceName.toLowerCase().includes(q) ||
            p.titleDisplay.toLowerCase().includes(q) ||
            p.country.toLowerCase().includes(q);

        const matchesCountry = !country || p.country === country;

        return matchesSearch && matchesCountry;
    });

    sortPlayers();
    renderTable();
}

function sortPlayers() {
    filteredPlayers.sort((a, b) => {
        let av = a[sortKey];
        let bv = b[sortKey];

        if (sortKey === 'lastPlayed') {
            av = av.getTime();
            bv = bv.getTime();
        }

        if (typeof av === 'string') {
            return sortAsc
                ? av.localeCompare(bv)
                : bv.localeCompare(av);
        }

        return sortAsc ? av - bv : bv - av;
    });
}

function renderTable() {
    rankingsBody.innerHTML = '';

    statusEl.textContent =
        `${filteredPlayers.length} player${filteredPlayers.length === 1 ? '' : 's'} shown`;

    for (const p of filteredPlayers) {
        const tr = document.createElement('tr');

        const playerId =
            playerIdMap.get(nameKey(p.name)) ??
            playerIdMap.get(nameKey(p.sourceName));

        const nameHtml = playerId != null
            ? `<a class="player-link" href="player.html?id=${encodeURIComponent(playerId)}">${escapeHtml(p.name)}</a>`
            : escapeHtml(p.name);

        tr.innerHTML = `
            <td class="rank">${p.rank}</td>
            <td>${escapeHtml(p.titleDisplay)}</td>
            <td class="name-column">${nameHtml}</td>
            <td>${escapeHtml(p.country)}</td>
            <td class="rating">${p.rating}</td>
            <td class="hide-mobile">${p.games}</td>
            <td class="hide-mobile">${formatDate(p.lastPlayed)}</td>
        `;

        rankingsBody.appendChild(tr);
    }
}

function escapeHtml(s) {
    return String(s)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
}

searchBox.addEventListener('input', applyFilters);
countryFilter.addEventListener('change', applyFilters);

document.querySelectorAll('th[data-sort]').forEach(th => {
    th.addEventListener('click', () => {
        const key = th.dataset.sort;

        if (sortKey === key) {
            sortAsc = !sortAsc;
        } else {
            sortKey = key;
            sortAsc = key === 'name' || key === 'country' || key === 'titleDisplay';
        }

        applyFilters();
    });
});
</script>
</body>
</html>
